# Het weekoverzicht van de teller (ADR-210, ADR-215).
#
# Elke maandagochtend: wat de teller de afgelopen week zag, naast de week
# ervoor, als issue met het label `teller`. Cijfers die je moet opzoeken, worden
# niet gebruikt; een issue komt vanzelf langs.
#
# Leest via de Management API van Supabase met SUPABASE_ACCESS_TOKEN, hetzelfde
# geheim als de kassa-workflow, en vindt het project zoals die dat doet: uit
# PREMIUM_URL, of PREMIUM_PROJECT_REF als die er is.
name: Teller per week

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  overzicht:
    if: ${{ vars.PREMIUM_URL != '' || vars.PREMIUM_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Welk project
        id: project
        env:
          PREMIUM_URL: ${{ vars.PREMIUM_URL }}
          PREMIUM_PROJECT_REF: ${{ vars.PREMIUM_PROJECT_REF }}
        run: |
          ref="$PREMIUM_PROJECT_REF"
          if [ -z "$ref" ]; then
            ref=$(printf '%s' "$PREMIUM_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*$#\1#')
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: De teller lezen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREMIUM_PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: node tools/premium/teller-week.mjs > overzicht.md

      - name: Als issue zetten
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('overzicht.md', 'utf8');
            const dag = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Teller: de week tot en met ${dag}`,
              labels: ['teller'],
              body,
            });

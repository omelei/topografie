# Zet de kassa-functie op het premiumproject van Supabase (ADR-123, ADR-201).
#
# Tot nu toe was dit een opdracht op een laptop (`supabase functions deploy
# kassa --no-verify-jwt`), en dat ging mis zoals dat gaat: de site noemde
# € 79,95 terwijl de kassa nog € 24,95 afrekende (ADR-196). Nu draait wat er in
# `main` staat, bij elke wijziging aan de kassa, en met de hand als dat nodig is.
#
# Het project volgt uit PREMIUM_URL (`https://<ref>.supabase.co`), dezelfde
# variabele die de app gebruikt; een eigen PREMIUM_PROJECT_REF gaat voor, als
# die er is. Het token is het persoonlijke token van de eigenaar, als geheim
# SUPABASE_ACCESS_TOKEN. Zonder token faalt de job met een zin die zegt wat er
# ontbreekt, in plaats van groen te zijn zonder iets te doen.
#
# De geheimen van de functie zelf (Mollie, Resend, de service-sleutel) staan in
# Supabase en worden hier niet aangeraakt.
name: Kassa functie

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/kassa/**'
      - '.github/workflows/kassa-functie.yml'

permissions:
  contents: read

concurrency:
  group: kassa-functie
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PREMIUM_URL != '' || vars.PREMIUM_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Welk project, en is er een token
        id: project
        env:
          PREMIUM_URL: ${{ vars.PREMIUM_URL }}
          PREMIUM_PROJECT_REF: ${{ vars.PREMIUM_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Het geheim SUPABASE_ACCESS_TOKEN ontbreekt. Maak een token op supabase.com/dashboard/account/tokens en zet het onder Settings → Secrets and variables → Actions."
            exit 1
          fi
          ref="$PREMIUM_PROJECT_REF"
          if [ -z "$ref" ]; then
            ref=$(printf '%s' "$PREMIUM_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*$#\1#')
          fi
          if ! printf '%s' "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::Uit PREMIUM_URL valt geen project-ref te halen. Zet PREMIUM_PROJECT_REF als repositoryvariabele."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Zonder JWT-controle, zoals `tools/premium/README.md` zegt: een ouder die
      # een code koopt, heeft geen account, en Mollie stuurt zijn melding ook
      # zonder token. Wat de functie beschermt, beschermt ze zelf.
      - name: Deploy kassa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy kassa \
            --project-ref "${{ steps.project.outputs.ref }}" \
            --no-verify-jwt
